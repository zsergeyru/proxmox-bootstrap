name: Patch connectivity check

on:
  push:
    branches: [fix-lightweight-github-connectivity-check]
    paths: [.github/workflows/patch-connectivity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-lightweight-github-connectivity-check
      - name: Patch bootstrap connectivity check
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap = Path('bootstrap-pve.sh')
          text = bootstrap.read_text(encoding='utf-8')
          replacements = {
              'PUBLIC_BOOTSTRAP_VERSION=12': 'PUBLIC_BOOTSTRAP_VERSION=13',
              '# v12 никогда не создаёт эти файлы и удаляет их после успешной миграции.': '# v13 никогда не создаёт эти файлы и удаляет их после успешной миграции.',
              'curl -fsS --connect-timeout 10 --max-time 20 -o /dev/null https://github.com/ \\\n        || die "GitHub недоступен по HTTPS с этого Proxmox host"': 'curl -fsSI --connect-timeout 10 --max-time 20 -o /dev/null https://github.com/ \\\n        || die "GitHub недоступен по HTTPS с этого Proxmox host"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected bootstrap fragment: {old!r}')
              text = text.replace(old, new, 1)
          bootstrap.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          rtext = readme.read_text(encoding='utf-8')
          old = 'PUBLIC_BOOTSTRAP_VERSION=12'
          if old not in rtext:
              raise SystemExit('README version marker not found')
          readme.write_text(rtext.replace(old, 'PUBLIC_BOOTSTRAP_VERSION=13', 1), encoding='utf-8')
          PY
          git diff --check
          bash -n bootstrap-pve.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bootstrap-pve.sh README.md
          git commit -m "fix: облегчить проверку HTTPS GitHub"
          git push origin HEAD:fix-lightweight-github-connectivity-check
