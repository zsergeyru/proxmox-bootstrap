name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: bash -n bootstrap-pve.sh

      - name: ShellCheck
        run: shellcheck -S warning bootstrap-pve.sh

      - name: Check whitespace errors
        run: git diff --check
