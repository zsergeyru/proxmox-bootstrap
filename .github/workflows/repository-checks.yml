name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: |
          bash -n bootstrap-pve.sh
          bash -n reset-pve-test-state.sh
          bash -n reset-pve-clean-slate.sh

      - name: Check help
        run: |
          bash bootstrap-pve.sh --help >/dev/null
          bash reset-pve-test-state.sh --help >/dev/null
          bash reset-pve-clean-slate.sh --help >/dev/null

      - name: ShellCheck
        run: shellcheck -S warning bootstrap-pve.sh reset-pve-test-state.sh reset-pve-clean-slate.sh

      - name: Check public bootstrap boundary
        run: |
          grep -q 'PRIVATE_HOST_ACCESS_PATH="scripts/infra-deployer/pve-bootstrap-access.sh"' bootstrap-pve.sh
          grep -q 'local config="/etc/pve/storage.cfg"' bootstrap-pve.sh
          grep -q 'pveam download "\$TEMPLATE_STORAGE" "\$template_name" >&2' bootstrap-pve.sh
          if grep -q 'ensure_host_packages' bootstrap-pve.sh; then
            echo "Public bootstrap must not install packages on the PVE host"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path("bootstrap-pve.sh").read_text()
          host_part = text[:text.index("bootstrap_ct_os() {")]
          forbidden = ("apt-get install", "apt install", "| jq", "jq -")
          for item in forbidden:
              if item in host_part:
                  raise SystemExit(f"host bootstrap must not depend on/install extra packages: {item}")
          PY
          if grep -Eq 'PVEVMAdmin|PVEDatastoreUser|PVESDNUser|PVETemplateUser|InfraManagedGuest|root@pam!infra-deployer' bootstrap-pve.sh; then
            echo "PVE access policy must stay in the private project"
            exit 1
          fi

      - name: Check whitespace errors
        run: git diff --check
