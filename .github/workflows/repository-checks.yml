name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: |
          bash -n bootstrap-pve.sh
          bash -n reset-pve-test-state.sh
          bash -n reset-pve-clean-slate.sh

      - name: Check help
        run: |
          bash bootstrap-pve.sh --help >/dev/null
          bash reset-pve-test-state.sh --help >/dev/null
          bash reset-pve-clean-slate.sh --help >/dev/null

      - name: ShellCheck
        run: shellcheck -S warning bootstrap-pve.sh reset-pve-test-state.sh reset-pve-clean-slate.sh

      - name: Check public bootstrap boundary
        run: |
          grep -q 'HOST_BOOTSTRAP_DIR="/root/.config/proxmox-bootstrap"' bootstrap-pve.sh
          grep -q 'HOST_GITHUB_KEY=' bootstrap-pve.sh
          grep -q 'PRIVATE_REPO="git@github.com:zsergeyru/proxmox.git"' bootstrap-pve.sh
          grep -q 'PRIVATE_SETUP_PATH="scripts/infra-manager/setup.sh"' bootstrap-pve.sh
          grep -q 'PRIVATE_HOST_ACCESS_PATH="scripts/infra-manager/pve-bootstrap-access.sh"' bootstrap-pve.sh
          grep -q 'exec 9>"\$LOCK_FILE"' bootstrap-pve.sh
          grep -q 'flock -n 9' bootstrap-pve.sh
          grep -q 'pct push "\$CTID" "\$HOST_GITHUB_KEY" "\$CT_GITHUB_KEY"' bootstrap-pve.sh

          if grep -Eq 'cleanup_host_runtime|rm[[:space:]].*LOCK_FILE|rm[[:space:]].*proxmox-bootstrap\.lock' bootstrap-pve.sh; then
            echo "Bootstrap lock file must remain persistent; flock is released by closing fd 9"
            exit 1
          fi

          if grep -Eq 'GUEST_BOOTSTRAP_REF|GUEST_BOOTSTRAP_URL|bootstrap-910\.sh' bootstrap-pve.sh; then
            echo "Only one public bootstrap file is allowed"
            exit 1
          fi

          if grep -Eq 'PVEVMAdmin|PVEDatastoreUser|PVESDNUser|PVETemplateUser|InfraManagedGuest|root@pam!infra-manager' bootstrap-pve.sh; then
            echo "PVE access policy must stay in the private project"
            exit 1
          fi

          grep -q '^main() {' bootstrap-pve.sh
          grep -q 'ensure_infra_manager_ct' bootstrap-pve.sh
          grep -q '^verify_ct_contract() {' bootstrap-pve.sh
          grep -q 'verify_ct_contract' bootstrap-pve.sh
          grep -q '/usr/local/sbin/infra-manager-status --full' bootstrap-pve.sh
          grep -q 'ensure_host_github_key' bootstrap-pve.sh
          grep -q 'checkout_private_project' bootstrap-pve.sh
          grep -q 'configure_pve_access' bootstrap-pve.sh
          grep -q 'configure_infra_manager' bootstrap-pve.sh
          grep -q 'verify_infra_manager' bootstrap-pve.sh
          grep -q -- '--remove' bootstrap-pve.sh
          grep -q -- '--purge' bootstrap-pve.sh
          grep -q 'remove_bootstrap 0' bootstrap-pve.sh
          grep -q 'remove_bootstrap 1' bootstrap-pve.sh
          grep -q 'ensure_debian13_template' bootstrap-pve.sh
          if grep -Eq 'HOST_TEMPLATE_MARKER|remove_owned_template|pveam remove' bootstrap-pve.sh; then
            echo "Debian 13 LXC template must remain available after bootstrap"
            exit 1
          fi
          grep -q 'remove_managed_pool_if_empty' bootstrap-pve.sh

      - name: Check whitespace errors
        run: git diff --check
