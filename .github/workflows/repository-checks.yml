name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate syntax
        run: |
          bash -n bootstrap-pve.sh
          python3 -m py_compile bootstrap-pve.py

      - name: Check help
        run: python3 bootstrap-pve.py --help >/dev/null

      - name: ShellCheck
        run: shellcheck -S warning bootstrap-pve.sh

      - name: Check public shell is only a Python loader
        run: |
          test "$(wc -l < bootstrap-pve.sh)" -le 20
          grep -q 'bootstrap-pve.py' bootstrap-pve.sh
          grep -q 'python3 "\$SCRIPT"' bootstrap-pve.sh
          grep -q 'curl -fsSL "\$URL"' bootstrap-pve.sh

          if grep -Eq 'pct|pveum|pvesm|CTID|infra-manager|OpenTofu|Ansible|Semaphore' bootstrap-pve.sh; then
            echo "bootstrap-pve.sh must only download and start bootstrap-pve.py"
            exit 1
          fi

      - name: Check public Python boundary
        run: |
          grep -q '^CTID = 990$' bootstrap-pve.py
          grep -q 'PRIVATE_ENTRYPOINT = .*bootstrap-host.py' bootstrap-pve.py
          grep -q 'PROJECT_REPO = "git@github.com:zsergeyru/proxmox.git"' bootstrap-pve.py
          grep -q 'managed-by=proxmox-bootstrap' bootstrap-pve.py

          if grep -Eq 'INFRA_CTID|PVEVMAdmin|PVEDatastoreUser|PVESDNUser|PVETemplateUser|InfraManagedGuest|deploy-910|pve-bootstrap-access|infra-manager-status' bootstrap-pve.py; then
            echo "Infrastructure orchestration must stay in the private project"
            exit 1
          fi

      - name: Check first Deploy Key stops before 990
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("bootstrap-pve.py")
          spec = importlib.util.spec_from_file_location("bootstrap_pve", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          class Harness(module.PublicBootstrap):
              def __init__(self):
                  super().__init__("feature/bootstrap-990", [])
                  self.events = []

              def require_pve(self):
                  self.events.append("require")

              def acquire_lock(self):
                  self.events.append("lock")

              def init_log(self):
                  self.events.append("log")

              def info(self, message):
                  self.events.append("info")

              def ensure_host_github_key(self):
                  self.events.append("new-key")
                  return True

              def ensure_ct(self):
                  raise AssertionError("990 must not be created before a new key is added to GitHub")

          host = Harness()
          host.execute()
          assert host.events == ["require", "lock", "log", "info", "new-key"], host.events
          PY

      - name: Check APT DNS permissions and _apt lookup
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          from types import SimpleNamespace

          spec = importlib.util.spec_from_file_location("public_bootstrap", Path("bootstrap-pve.py"))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          class Harness(module.PublicBootstrap):
              def __init__(self, mode, broken_domain=None):
                  super().__init__("main", [])
                  self.mode = mode
                  self.broken_domain = broken_domain
                  self.calls = []

              def run(self, *args, **kwargs):
                  assert args == ("pct", "exec", str(module.CTID), "--", "stat", "-c", "%a", "/etc")
                  assert kwargs == {"capture": True}
                  return SimpleNamespace(stdout=self.mode + "\\n")

              def ct_exec(self, *args, **kwargs):
                  self.calls.append(args)
                  if args == ("chmod", "0755", "/etc"):
                      assert kwargs == {"quiet": True}
                      self.mode = "755"
                      return SimpleNamespace(returncode=0)
                  assert args[:6] == ("runuser", "-u", "_apt", "--", "getent", "ahostsv4"), args
                  assert kwargs == {"quiet": True, "check": False}
                  return SimpleNamespace(returncode=int(args[-1] == self.broken_domain))

          healthy = Harness("755")
          healthy.ensure_apt_dns()
          assert len(healthy.calls) == 2, healthy.calls

          repaired = Harness("700")
          repaired.ensure_apt_dns()
          assert repaired.mode == "755", repaired.mode
          assert repaired.calls[0] == ("chmod", "0755", "/etc"), repaired.calls
          assert len(repaired.calls) == 3, repaired.calls

          broken = Harness("700", "deb.debian.org")
          try:
              broken.ensure_apt_dns()
          except module.BootstrapError as exc:
              assert "_apt" in str(exc), exc
          else:
              raise AssertionError("DNS error for _apt must stop before apt install")
          assert broken.mode == "755", broken.mode
          PY

      - name: Check template reference stays clean
        run: |
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace

          path = Path("bootstrap-pve.py")
          spec = importlib.util.spec_from_file_location("bootstrap_pve", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          class Harness(module.PublicBootstrap):
              def __init__(self):
                  super().__init__("feature/bootstrap-990", [])
                  self.messages = []

              def find_local_template(self):
                  return None

              def info(self, message):
                  self.messages.append(message)

              def run(self, *args, **kwargs):
                  if args[:3] == ("pveam", "available", "--section"):
                      return SimpleNamespace(
                          returncode=0,
                          stdout=(
                              "system debian-13-standard_13.9-1_amd64.tar.zst\n"
                              "system debian-13-standard_13.10-1_amd64.tar.zst\n"
                          ),
                          stderr="",
                      )
                  return SimpleNamespace(returncode=0, stdout="", stderr="")

          original_dir = module.HOST_BOOTSTRAP_DIR
          original_marker = module.HOST_TEMPLATE_MARKER
          try:
              with tempfile.TemporaryDirectory() as tmp:
                  module.HOST_BOOTSTRAP_DIR = Path(tmp)
                  module.HOST_TEMPLATE_MARKER = Path(tmp) / "template.ref"
                  host = Harness()
                  ref = host.ensure_template()
                  assert ref == "local:vztmpl/debian-13-standard_13.10-1_amd64.tar.zst", ref
                  assert host.messages == ["Скачивается Debian 13 LXC-шаблон"], host.messages
                  assert module.HOST_TEMPLATE_MARKER.read_text().strip() == ref
          finally:
              module.HOST_BOOTSTRAP_DIR = original_dir
              module.HOST_TEMPLATE_MARKER = original_marker
          PY

      - name: Check persistent lock discipline
        run: |
          grep -q 'fcntl.LOCK_EX | fcntl.LOCK_NB' bootstrap-pve.py
          if grep -Eq 'unlink\(.*LOCK_FILE|rm[[:space:]].*proxmox-bootstrap\.lock' bootstrap-pve.py bootstrap-pve.sh; then
            echo "Bootstrap lock file must remain persistent"
            exit 1
          fi

      - name: Check public repository stays minimal
        run: |
          expected="$(printf '%s\n' \
            .github/workflows/repository-checks.yml \
            README.md \
            bootstrap-pve.py \
            bootstrap-pve.sh)"
          actual="$(git ls-files | sort)"
          test "$actual" = "$expected"

      - name: Check whitespace errors
        run: git diff --check
