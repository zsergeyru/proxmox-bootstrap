name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell syntax
        run: |
          bash -n bootstrap-pve.sh
          bash -n reset-pve-test-state.sh
          bash -n reset-pve-clean-slate.sh

      - name: Check help
        run: |
          bash bootstrap-pve.sh --help >/dev/null
          bash reset-pve-test-state.sh --help >/dev/null
          bash reset-pve-clean-slate.sh --help >/dev/null

      - name: ShellCheck
        run: shellcheck -S warning bootstrap-pve.sh reset-pve-test-state.sh reset-pve-clean-slate.sh

      - name: Check public bootstrap boundary
        run: |
          grep -q '^CTID=990$' bootstrap-pve.sh
          grep -q '^CT_HOSTNAME="bootstrap-runner"$' bootstrap-pve.sh
          grep -q '^INFRA_CTID=910$' bootstrap-pve.sh
          grep -q 'PROJECT_DIR="/var/lib/bootstrap-runner/project"' bootstrap-pve.sh
          grep -q 'HOST_BOOTSTRAP_DIR="/root/.config/proxmox-bootstrap"' bootstrap-pve.sh
          grep -q 'HOST_GITHUB_KEY=' bootstrap-pve.sh
          grep -q 'PROJECT_REPO="git@github.com:zsergeyru/proxmox.git"' bootstrap-pve.sh
          grep -q 'scripts/bootstrap-runner/pve-access.sh' bootstrap-pve.sh
          grep -q 'scripts/bootstrap-runner/prepare-runtime.sh' bootstrap-pve.sh
          grep -q 'scripts/bootstrap-runner/deploy-910.sh' bootstrap-pve.sh
          grep -q 'scripts/infra-manager/pve-bootstrap-access.sh' bootstrap-pve.sh
          grep -q 'create_infra_manager_infrastructure' bootstrap-pve.sh
          grep -q 'provision_existing_infra_manager' bootstrap-pve.sh
          grep -q 'verify_infra_manager_ready' bootstrap-pve.sh
          grep -q 'finalize_bootstrap_runner' bootstrap-pve.sh
          grep -q 'remove_private_access' bootstrap-pve.sh
          grep -q 'rm -rf /etc/bootstrap-runner/secrets /var/lib/bootstrap-runner/opentofu/state' bootstrap-pve.sh
          grep -q 'pct destroy "\$CTID" --purge 1' bootstrap-pve.sh
          grep -q '/usr/local/sbin/infra-manager-status --full' bootstrap-pve.sh
          grep -q 'exec 9>"\$LOCK_FILE"' bootstrap-pve.sh
          grep -q 'flock -n 9' bootstrap-pve.sh
          grep -q -- '--recover' bootstrap-pve.sh
          grep -q -- '--remove' bootstrap-pve.sh
          grep -q -- '--purge' bootstrap-pve.sh

          if grep -Eq 'scripts/infra-manager/setup\.sh|python3[[:space:]]+-m[[:space:]]+infra_manager[[:space:]]+setup|infra_manager[[:space:]]+setup' bootstrap-pve.sh; then
            echo "910 must be configured only through the common Ansible path"
            exit 1
          fi

          if grep -Eq 'PVEVMAdmin|PVEDatastoreUser|PVESDNUser|PVETemplateUser|InfraManagedGuest' bootstrap-pve.sh; then
            echo "PVE access policy must stay in the private project"
            exit 1
          fi

          if grep -Eq 'cleanup_host_runtime|rm[[:space:]].*LOCK_FILE|rm[[:space:]].*proxmox-bootstrap\.lock' bootstrap-pve.sh; then
            echo "Bootstrap lock file must remain persistent; flock is released by closing fd 9"
            exit 1
          fi

          test ! -e bootstrap-runner-990.sh

      - name: Check whitespace errors
        run: git diff --check
